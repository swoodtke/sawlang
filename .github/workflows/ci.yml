name: CI

# Gating lives in sawtracker: patches are tested and approved there before they
# merge to GitHub, so nothing triggers on push/PR. A manual run executes the
# same entry point the server's per-patch gate does, with no changed-path
# narrowing, so every part runs.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # The gate's tools use the standard library alone; build.sh makes the
      # venv from this interpreter.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # sawc's .ll is compiled and linked by clang, which must take
      # opaque-pointer IR (LLVM 15 or later); macOS ships one with Xcode.
      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: The per-patch gate, every part (./build.sh test)
        run: ./build.sh test
