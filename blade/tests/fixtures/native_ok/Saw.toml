[package]
name = "native_ok"
version = "0.1.0"

[native]
objects = ["a.o", "b/*.o"]
archives = ["libx.a"]
libraries = ["z", "m"]
library-paths = ["/opt/lib"]

[native.arm64-apple-darwin]
objects = ["mac.o"]
frameworks = ["Security", "CoreFoundation"]
libraries = ["iconv"]

[native.aarch64-unknown-linux-gnu]
objects = ["linux.o"]
archives = ["liblinux.a"]
