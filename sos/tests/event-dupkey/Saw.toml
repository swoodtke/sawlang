[package]
name = "event-dupkey"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# A root server that attaches two Events to one Waiter under the SAME key
# (design 178 M2 unit 3 rider 4). Keys are unique per Waiter, so the kernel
# terminates it — and unlike the unit's other fault cases this one is written in
# ordinary Saw against the typed API, because a duplicate key is a mistake the
# typed layer cannot prevent: both handles are real and both keys are the
# caller's own words.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
