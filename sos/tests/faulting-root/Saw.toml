[package]
name = "faulting-root"
version = "0.1.0"

# A root server that oversteps: same build shape as sos/root, but its `_start`
# writes to the kernel's text. It shares the real root's linker script and
# syscall stubs so that the ONLY difference under test is what the program does.
[sos]
emit = "sosimg"
target = "riscv32-unknown-none-elf"
linker-script = "../../root/root.ld"
native = "../../root/src/rt.c"
priorities = { background = 0, low = 1, normal = 1, high = 1 }
