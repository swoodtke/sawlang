[package]
name = "faulting-root"
version = "0.1.0"

# A root server that oversteps: same build shape as sos/root, but its `_start`
# writes to the kernel's text. It shares the real root's linker scripts and
# syscall stubs so that the ONLY difference under test is what the program does.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c ../riscv32/fault_target.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c ../arm64/fault_target.c"
