[package]
name = "event-consume"
version = "0.1.0"

# Same reason as sos/root's: this image carries its own `__saw_rt_*` seams, out
# of the `sosrt` module its `sos` dependency pulls in. See that manifest.
runtime = true

# A root server that reads Events THROUGH THE BLOCKING DOOR without ever
# blocking (ruled Aug 17, user; spec §2.2, §2.4). One thread, so nothing here is
# about scheduling: every wait finds something already ready and answers at
# once. What it proves is that a wait DELIVERY takes the accumulated word — the
# merged word, once, and only the bits that arrived since the last take. The
# parking half is `event-consume-wake`.
[dependencies]
sos = { path = "../../kernel/sysapi" }

[sos]
emit = "sosimg"
priorities = { background = 0, low = 1, normal = 1, high = 1 }

[sos.riscv32-unknown-none-elf]
linker-script = "../../hal/riscv32/user/root.ld"
native = "../../hal/riscv32/user/syscall.c ../../rt/common_c/support.c"

[sos.aarch64-unknown-none-elf]
linker-script = "../../hal/arm64/user/root.ld"
native = "../../hal/arm64/user/syscall.c ../../rt/common_c/support.c"
