[package]
name = "sos"
version = "0.1.0"

# The kernel's PUBLIC userspace API. U-mode library code that lives in the
# kernel's tree and is exported from it — the Zircon-vDSO discipline
# (sos/spec.md §5.7). A process depends on this package and never on `sosabi`
# directly; the numbers arrive linked in, not written down.
[dependencies]
sosabi = { path = "../abi" }
# The arch-free, role-free helpers the kernel uses too. Depending on it here
# rather than restating `ascii_byte` is what keeps the kernel console and a
# process console agreeing on what a non-ASCII scalar becomes.
sosrt = { path = "../../rt/common" }
