[package]
name = "sosrt"
version = "0.1.0"

# Arch-free AND role-free: consumed by the kernel build and by every SOS
# process build alike. Primitives only, so it compiles freestanding for any
# target. See src/lib.saw.
#
# This package holds the four frozen `__saw_rt_*` seams (design 172 part 2), but
# it does NOT carry `runtime = true` itself — deliberately. That key makes Blade
# pass `--runtime-provider` to a COMPILE, and this package is never compiled on
# its own: it rides into an image as a module. The declaration therefore belongs
# to the thing being built — `sos/root/Saw.toml` for a process image,
# `tools/sos_runner.py`'s command line for a kernel — and putting it here too
# would read like the source of truth while changing nothing.
