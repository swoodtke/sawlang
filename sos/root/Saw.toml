[package]
name = "sos-root"
version = "0.1.0"

# The SOS root server is a freestanding riscv32 process image, not a host
# binary: `blade build` compiles it with `--freestanding`, links it at its fixed
# load address with root.ld, and emits a flat sosimg the kernel can walk.
# See sos/spec.md §6 (boot protocol), §7 (priority bands), §12 (root server).
[dependencies]
# The kernel's exported userspace API (sos/spec.md §5.7): typed wrappers over
# the syscall surface, owned by the kernel package so the op numbers stay
# inside it. This is the ONLY thing root needs to talk to the kernel.
sos = { path = "../kernel/sysapi" }

[sos]
emit = "sosimg"
target = "riscv32-unknown-none-elf"
linker-script = "root.ld"

# `native` is a space-separated list of translation units. Root's own sources
# name no architecture; everything that does is reached HERE, through the HAL,
# so M1b's arm64 port changes this line and nothing in src/.
native = "../hal/riscv32/user/syscall.c ../rt/common_c/support.c"

# spec §7: a REQUEST, not authority. The kernel applies root's map verbatim
# because it parses root's image anyway and root is trusted by construction;
# for every later process the launcher may honor, clamp, or override it.
priorities = { background = 0, low = 1, normal = 1, high = 1 }
